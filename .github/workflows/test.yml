name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check
      - run: npm install --no-save --package-lock=false puppeteer-core@25.16.0
      - run: npm run test:browser
        env:
          CHROME_PATH: /usr/bin/google-chrome
